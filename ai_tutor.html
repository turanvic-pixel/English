<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ИИ-репетитор — English</title>
<style>
  :root{
    --navy:#3B2E1C;
    --blue:#8C6A2F;
    --blue-light:#FBF3DE;
    --accent:#C9971F;
    --line:#E6D9BA;
    --ink:#2B2118;
    --sub:#8A7658;
    --bg:#FAF5E9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  header{
    background:linear-gradient(160deg,#FDF3D3 0%,#FBE9A8 100%);
    padding:1rem 1.2rem;
    text-align:center;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  header h1{
    margin:0;
    font-size:1.15rem;
    color:var(--navy);
  }
  header p{
    margin:.2rem 0 0;
    font-size:.78rem;
    color:var(--sub);
  }

  #setup{
    max-width:480px;
    margin:1rem auto;
    padding:1rem 1.2rem;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 4px 18px rgba(59,46,28,.06);
    flex:none;
  }
  #setup label{
    display:block;
    font-size:.8rem;
    color:var(--sub);
    margin:.5rem 0 .2rem;
  }
  #setup input, #setup select{
    width:100%;
    padding:.55rem .7rem;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:.9rem;
    font-family:inherit;
  }
  #setup button{
    margin-top:.9rem;
    width:100%;
    padding:.65rem;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }
  #setup button:hover{ opacity:.9; }

  #chat-wrap{
    display:none;
    flex:1;
    flex-direction:column;
    max-width:680px;
    width:100%;
    margin:0 auto;
    min-height:0;
  }
  #messages{
    flex:1;
    overflow-y:auto;
    padding:1rem 1rem 1.2rem;
    min-height:0;
  }
  .msg{
    max-width:80%;
    padding:.6rem .85rem;
    border-radius:14px;
    margin-bottom:.7rem;
    font-size:.92rem;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .msg.user{
    background:var(--accent);
    color:#fff;
    margin-left:auto;
    border-bottom-right-radius:3px;
  }
  .msg.model{
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    margin-right:auto;
    border-bottom-left-radius:3px;
  }
  .msg.system{
    background:transparent;
    color:var(--sub);
    font-size:.78rem;
    text-align:center;
    max-width:100%;
    margin:0 auto .7rem;
    font-style:italic;
  }
  .msg.typing{ color:var(--sub); font-style:italic; }

  #input-row{
    flex:none;
    display:flex;
    gap:.5rem;
    padding:.8rem 1rem;
    border-top:1px solid var(--line);
    background:#fff;
  }
  #input-row textarea{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:10px;
    padding:.6rem .7rem;
    font-family:inherit;
    font-size:.9rem;
    max-height:6rem;
  }
  #input-row button{
    border:none;
    background:var(--accent);
    color:#fff;
    border-radius:10px;
    padding:0 1.1rem;
    font-weight:700;
    cursor:pointer;
  }
  #input-row button:disabled{ opacity:.5; cursor:not-allowed; }

  #global-home-nav{
    position:fixed;top:10px;right:10px;z-index:2147483647;
    background:#12233F;color:#fff;text-decoration:none;font-size:12px;font-weight:700;
    padding:8px 13px;border-radius:20px;box-shadow:0 3px 12px rgba(18,35,63,.35);
    display:inline-flex;align-items:center;gap:5px;font-family:Arial,sans-serif;line-height:1;
  }
</style>
</head>
<body>

<a href="index.html" id="global-home-nav">🏠 Все тесты</a>

<header>
  <h1>🤖 ИИ-репетитор по английскому</h1>
  <p>Не даёт готовых ответов — помогает найти их самому</p>
</header>

<div id="setup">
  <label for="f-name">Имя и Фамилия</label>
  <input type="text" id="f-name" placeholder="Иван Иванов">
  <label for="f-group">Номер группы</label>
  <input type="text" id="f-group" placeholder="101">
  <label for="f-topic">Какая тема сейчас?</label>
  <select id="f-topic">
    <option value="">Не важно / общий вопрос</option>
    <option value="Present Simple">Present Simple</option>
    <option value="Present Continuous">Present Continuous</option>
    <option value="Past Simple">Past Simple</option>
    <option value="Future Simple">Future Simple</option>
    <option value="Глагол to be">Глагол to be</option>
    <option value="Личные и притяжательные местоимения">Личные и притяжательные местоимения</option>
    <option value="Предлоги">Предлоги</option>
    <option value="There is / There are">There is / There are</option>
    <option value="Степени сравнения прилагательных">Степени сравнения прилагательных</option>
    <option value="Множественное число существительных">Множественное число существительных</option>
    <option value="Числительные">Числительные</option>
  </select>
  <button id="start-btn">Начать</button>
</div>

<div id="chat-wrap">
  <div id="messages"></div>
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="Напиши свой вопрос или застрявшее предложение..."></textarea>
    <button id="send-btn">Отправить</button>
  </div>
</div>

<script>
(function(){
  var BACKEND = 'https://english-ai-tutor-ky0f.onrender.com/chat';
  var history = [];
  var studentContext = '';

  var setup = document.getElementById('setup');
  var chatWrap = document.getElementById('chat-wrap');
  var messagesEl = document.getElementById('messages');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('send-btn');
  var startBtn = document.getElementById('start-btn');

  function addMsg(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  startBtn.addEventListener('click', function(){
    var name = document.getElementById('f-name').value.trim();
    var group = document.getElementById('f-group').value.trim();
    var topic = document.getElementById('f-topic').value;

    var parts = [];
    if (name) parts.push('Имя: ' + name);
    if (group) parts.push('Группа: ' + group);
    if (topic) parts.push('Сейчас изучает тему: ' + topic);
    studentContext = parts.join('. ');

    setup.style.display = 'none';
    chatWrap.style.display = 'flex';
    var greet = topic
      ? 'Привет' + (name ? ', ' + name.split(' ')[0] : '') + '! Давай разберём ' + topic + '. С каким предложением или вопросом застрял?'
      : 'Привет' + (name ? ', ' + name.split(' ')[0] : '') + '! Что разбираем сегодня?';
    addMsg('model', greet);
    history.push({ role: 'model', text: greet });
    inputEl.focus();
  });

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 96) + 'px';
  }
  inputEl.addEventListener('input', autoResize);

  function send() {
    var text = inputEl.value.trim();
    if (!text) return;
    addMsg('user', text);
    history.push({ role: 'user', text: text });
    inputEl.value = '';
    autoResize();
    sendBtn.disabled = true;

    var typingEl = addMsg('model typing', 'печатает...');

    fetch(BACKEND, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(0, -1), studentContext: studentContext })
    }).then(function(r){ return r.json(); }).then(function(data){
      typingEl.remove();
      var reply = data.reply || 'Извини, что-то пошло не так. Попробуй ещё раз.';
      addMsg('model', reply);
      history.push({ role: 'model', text: reply });
    }).catch(function(){
      typingEl.remove();
      addMsg('system', 'Не удалось связаться с репетитором. Проверь интернет и попробуй ещё раз.');
    }).finally(function(){
      sendBtn.disabled = false;
      inputEl.focus();
    });
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
})();
</script>

</body>
</html>
